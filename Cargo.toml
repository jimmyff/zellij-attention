[package]
name = "zellij-attention"
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["jimmyff <code@rocketware.io>"]
description = "A Zellij plugin that flags which tab needs your attention with a 3-state priority indicator"
repository = "https://github.com/jimmyff/zellij-attention"

[lib]
name = "zellij_attention"
path = "src/lib.rs"

[[bin]]
name = "zellij-attention"
path = "src/main.rs"

[dependencies]
zellij-tile = "0.43.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
